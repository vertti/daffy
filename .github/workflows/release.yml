name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")
          printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          install_args: uv
          cache: false

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: dist/*
          body_path: release-notes.md
